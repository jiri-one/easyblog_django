name: Django Tests (PyTest)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run_tests:
    name: Run Django Tests
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.13"]
    services:
      db:
        image: postgres:18-alpine  # the production database is Postgres 18 too
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: github_actions
        ports:
          - 5432:5432
        # since 18 the data is in /var/lib/postgresql/18/docker; a mount on .../data stops the image
        options: --mount type=tmpfs,destination=/var/lib/postgresql --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install '.[dev]'
      - name: Remove installed easyblog_django
        run: pip uninstall -y easyblog_django
      - name: Run tests
        run: pytest -v
        env:
          SYSTEM_ENV: GITHUB_WORKFLOW
      - name: Ruff
        run: ruff check src
      - name: Pyright
        run: pyright
